<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Tower MX - S&OP y Riesgos</title>
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <style>
        :root {
            --tactico: #e74c3c;
            --estrategico: #2980b9;
            --bg-light: #f4f7f6;
            --text-dark: #2c3e50;
        }

        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            overflow: hidden; background-color: #ffffff;
        }

        #app-container {
            display: flex; width: 100vw; height: 100vh;
        }

        #map-wrapper {
            flex: 1; height: 100%; position: relative;
            display: flex; align-items: center; justify-content: center;
            background-color: #e5f1f6; 
            transition: all 0.4s ease-in-out;
        }

        #regions_div {
            width: 100%; height: 100%;
        }

        .mode-selector {
            position: absolute;
            top: 20px; left: 50%;
            transform: translateX(-50%);
            background: white;
            border-radius: 50px;
            display: flex;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            overflow: hidden;
            z-index: 10;
        }

        .mode-btn {
            padding: 12px 24px; border: none; background: transparent;
            font-weight: bold; font-size: 14px; cursor: pointer;
            transition: all 0.3s; color: #7f8c8d; outline: none;
        }

        .mode-btn.active-tactico { background: var(--tactico); color: white; }
        .mode-btn.active-estrategico { background: var(--estrategico); color: white; }

        #news-panel {
            width: 0%; height: 100%; background: var(--bg-light);
            border-left: 1px solid #ddd;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto; box-sizing: border-box;
        }

        .split-view #news-panel { width: 40%; padding: 20px; }
        .split-view #map-wrapper { flex: 0 0 60%; }

        .news-card {
            background: white; border-radius: 8px; padding: 15px;
            margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: border-left 0.3s;
        }

        .card-tactico { border-left: 5px solid var(--tactico); }
        .card-estrategico { border-left: 5px solid var(--estrategico); }

        .news-card h3 { margin: 0 0 8px 0; font-size: 14px; line-height: 1.4; color: var(--text-dark); }
        .news-date { font-size: 11px; color: #7f8c8d; font-weight: bold; margin-bottom: 5px; }
        .news-link { font-size: 12px; text-decoration: none; font-weight: bold; }
        
        .tag {
            display: inline-block; padding: 3px 8px; background: #eee;
            border-radius: 4px; font-size: 10px; color: #555; margin-right: 5px; font-weight: bold;
        }
    </style>
</head>
<body>

<div id="app-container">
    <div id="map-wrapper">
        <div class="mode-selector">
            <button id="btn-tactico" class="mode-btn active-tactico" onclick="switchMode('tactico')">⚠️ Táctico: Riesgos en Ruta</button>
            <button id="btn-estrategico" class="mode-btn" onclick="switchMode('estrategico')">🏗️ Estratégico: Obras y Demanda</button>
        </div>
        <div id="regions_div"></div>
    </div>
    
    <div id="news-panel">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px;">
            <h2 id="panel-title" style="margin:0; font-size: 1.4rem; color: var(--text-dark);">Monitoreo</h2>
            <button onclick="cerrarPanel()" style="border:none; background:none; font-size:28px; cursor:pointer; color:#888;">&times;</button>
        </div>
        <div id="news-content"></div>
    </div>
</div>

<script>
    const stateNames = {
        'MX-AGU': 'Aguascalientes', 'MX-BCN': 'Baja California', 'MX-BCS': 'Baja California Sur',
        'MX-CAM': 'Campeche', 'MX-CHP': 'Chiapas', 'MX-CHH': 'Chihuahua', 'MX-CMX': 'Ciudad de México',
        'MX-COA': 'Coahuila', 'MX-COL': 'Colima', 'MX-DUR': 'Durango', 'MX-GRO': 'Guerrero',
        'MX-GUA': 'Guanajuato', 'MX-HID': 'Hidalgo', 'MX-JAL': 'Jalisco', 'MX-MEX': 'Estado de México',
        'MX-MIC': 'Michoacán', 'MX-MOR': 'Morelos', 'MX-NAY': 'Nayarit', 'MX-NLE': 'Nuevo León',
        'MX-OAX': 'Oaxaca', 'MX-PUE': 'Puebla', 'MX-QUE': 'Querétaro', 'MX-ROO': 'Quintana Roo',
        'MX-SLP': 'San Luis Potosí', 'MX-SIN': 'Sinaloa', 'MX-SON': 'Sonora', 'MX-TAB': 'Tabasco',
        'MX-TAM': 'Tamaulipas', 'MX-TLA': 'Tlaxcala', 'MX-VER': 'Veracruz', 'MX-YUC': 'Yucatán',
        'MX-ZAC': 'Zacatecas'
    };

    let chart, data, options;
    let currentMode = 'tactico'; 
    let currentStateSelected = null;

    google.charts.load('current', {'packages':['geochart']});
    google.charts.setOnLoadCallback(initMap);

    function initMap() {
        data = google.visualization.arrayToDataTable([
            ['Estado', 'Monitoreo'],
            ['MX-AGU', 0], ['MX-BCN', 0], ['MX-BCS', 0], ['MX-CAM', 0], ['MX-CHP', 0],
            ['MX-CHH', 0], ['MX-CMX', 0], ['MX-COA', 0], ['MX-COL', 0], ['MX-DUR', 0],
            ['MX-GRO', 0], ['MX-GUA', 0], ['MX-HID', 0], ['MX-JAL', 0], ['MX-MEX', 0],
            ['MX-MIC', 0], ['MX-MOR', 0], ['MX-NAY', 0], ['MX-NLE', 0], ['MX-OAX', 0],
            ['MX-PUE', 0], ['MX-QUE', 0], ['MX-ROO', 0], ['MX-SLP', 0], ['MX-SIN', 0],
            ['MX-SON', 0], ['MX-TAB', 0], ['MX-TAM', 0], ['MX-TLA', 0], ['MX-VER', 0],
            ['MX-YUC', 0], ['MX-ZAC', 0]
        ]);

        chart = new google.visualization.GeoChart(document.getElementById('regions_div'));

        google.visualization.events.addListener(chart, 'select', () => {
            const selection = chart.getSelection();
            if (selection.length > 0) {
                const stateIso = data.getValue(selection[0].row, 0);
                currentStateSelected = stateNames[stateIso];
                abrirPanel(currentStateSelected);
            }
        });

        drawMapWithCurrentMode();
    }

    function drawMapWithCurrentMode() {
        const mapColor = currentMode === 'tactico' ? '#e74c3c' : '#2980b9'; 
        
        options = {
            region: 'MX',
            resolution: 'provinces',
            colorAxis: {colors: [mapColor]}, 
            backgroundColor: '#e5f1f6',
            datalessRegionColor: '#f4f4f4',
            defaultColor: mapColor,
            tooltip: { trigger: 'focus' },
            keepAspectRatio: true
        };
        
        if(chart && data) chart.draw(data, options);
    }

    function switchMode(mode) {
        currentMode = mode;
        
        document.getElementById('btn-tactico').classList.remove('active-tactico');
        document.getElementById('btn-estrategico').classList.remove('active-estrategico');
        
        if (mode === 'tactico') {
            document.getElementById('btn-tactico').classList.add('active-tactico');
        } else {
            document.getElementById('btn-estrategico').classList.add('active-estrategico');
        }

        drawMapWithCurrentMode();

        if (currentStateSelected && document.getElementById('app-container').classList.contains('split-view')) {
            abrirPanel(currentStateSelected);
        }
    }

    function abrirPanel(estadoNombre) {
        const container = document.getElementById('app-container');
        const titlePrefix = currentMode === 'tactico' ? 'Riesgos Viales en' : 'Proyectos en';
        document.getElementById('panel-title').innerText = `${titlePrefix} ${estadoNombre}`;
        
        container.classList.add('split-view');
        setTimeout(() => drawMapWithCurrentMode(), 400); 
        
        fetchNewsForState(estadoNombre);
    }

    function cerrarPanel() {
        const container = document.getElementById('app-container');
        container.classList.remove('split-view');
        currentStateSelected = null;
        setTimeout(() => drawMapWithCurrentMode(), 400);
    }

    // NUEVO MOTOR DE BÚSQUEDA NATIVO (Sin rs2json)
    async function fetchNewsForState(estadoNombre) {
        const contentDiv = document.getElementById('news-content');
        contentDiv.innerHTML = `<p style="text-align:center; color:#666;">Analizando radar en tiempo real para ${estadoNombre}...</p>`;

        let searchTerms = "";
        let tagHtml = "";
        let cardClass = currentMode === 'tactico' ? 'card-tactico' : 'card-estrategico';
        let linkColor = currentMode === 'tactico' ? '#e74c3c' : '#2980b9';

        if (currentMode === 'tactico') {
            searchTerms = `${estadoNombre} carretera OR trafico OR accidente OR bloqueo`;
            tagHtml = `<span class="tag">Logística</span><span class="tag">Ruta</span>`;
        } else {
            searchTerms = `${estadoNombre} infraestructura OR inversion OR construccion`;
            tagHtml = `<span class="tag">Desarrollo</span><span class="tag">Inversión</span>`;
        }
        
        const rssUrl = `https://news.google.com/rss/search?q=${encodeURIComponent(searchTerms)}&hl=es-419&gl=MX&ceid=MX:es-419`;
        
        // Usamos un proxy CORS abierto para saltar restricciones del navegador, leyendo el XML puro
        const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(rssUrl)}`;

        try {
            const res = await fetch(proxyUrl);
            const dataResponse = await res.json();

            // Magia JS: Traducir el XML crudo sin depender de servidores externos
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(dataResponse.contents, "text/xml");
            const items = Array.from(xmlDoc.querySelectorAll("item"));

            if (items.length > 0) {
                // Mapear los datos del XML a un arreglo ordenable
                let newsArray = items.map(item => ({
                    title: item.querySelector("title").textContent,
                    link: item.querySelector("link").textContent,
                    pubDate: new Date(item.querySelector("pubDate").textContent)
                }));

                // Ordenar cronológicamente (Más reciente primero)
                newsArray.sort((a, b) => b.pubDate - a.pubDate);
                
                contentDiv.innerHTML = newsArray.slice(0, 15).map(item => {
                    const dateStr = item.pubDate.toLocaleString('es-MX', {
                        day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit'
                    });
                    return `
                        <div class="news-card ${cardClass}">
                            <div class="news-date">🗓️ ${dateStr}</div>
                            <h3>${item.title}</h3>
                            <div style="margin-bottom: 8px;">${tagHtml}</div>
                            <a class="news-link" href="${item.link}" target="_blank" style="color:${linkColor}">LEER REPORTE ➜</a>
                        </div>
                    `;
                }).join('');
            } else {
                contentDiv.innerHTML = `
                    <div style="text-align:center; padding: 20px;">
                        <p style="font-size: 40px; margin: 0;">${currentMode === 'tactico' ? '✅' : '📊'}</p>
                        <p style="color:#7f8c8d;">Radar despejado. No se encontraron reportes en las últimas horas.</p>
                    </div>`;
            }
        } catch (err) {
            console.error("Error al extraer alertas:", err);
            contentDiv.innerHTML = "<p style='color:#e74c3c; text-align:center;'>Error de conexión al procesar la información de Google News.</p>";
        }
    }

    window.addEventListener('resize', () => {
        if(chart && data && options) chart.draw(data, options);
    });
</script>

</body>
</html>
