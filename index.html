<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogiTrack MX - Monitor de Riesgos</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #e74c3c;
            --bg-light: #f8f9fa;
        }

        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            width: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            overflow: hidden; 
            background-color: #ffffff;
        }

        #app-container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        #map-wrapper {
            flex: 1;
            height: 100%; 
            position: relative;
            z-index: 1;
        }

        #map {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #e5e3df; /* Color base */
            z-index: 2;
        }

        #news-panel {
            width: 0%;
            height: 100%;
            background: var(--bg-light);
            border-left: 1px solid #ddd;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
            z-index: 10;
        }

        .split-view #news-panel { width: 40%; padding: 20px; }
        .split-view #map-wrapper { flex: 0 0 60%; }

        .btn-toggle {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--primary);
            color: white;
            padding: 14px 28px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            border: none;
        }

        .news-card {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border-left: 5px solid var(--accent);
        }

        .news-card h3 { margin: 0 0 8px 0; font-size: 15px; line-height: 1.4; color: #333; }
        .news-date { font-size: 11px; color: #7f8c8d; font-weight: bold; margin-bottom: 5px; }
        .news-link { color: var(--primary); font-size: 12px; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div id="app-container">
    <div id="map-wrapper">
        <button class="btn-toggle" onclick="toggleDashboard()" id="btn-text">📦 ANALIZAR RIESGOS LOGÍSTICOS</button>
        <div id="map"></div>
    </div>
    
    <div id="news-panel">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px;">
            <h2 style="margin:0; font-size: 1.5rem;">Eventos Recientes</h2>
            <button onclick="toggleDashboard()" style="border:none; background:none; font-size:28px; cursor:pointer; color:#888;">&times;</button>
        </div>
        <div id="news-content"></div>
    </div>
</div>

<script>
    let map;
    let isDashboardOpen = false;
    const gdlCenter = { lat: 20.6596, lng: -103.3496 };

    function initMap() {
        console.log("Google Maps Initialized Successfully");
        try {
            map = new google.maps.Map(document.getElementById("map"), {
                zoom: 7,
                center: gdlCenter,
                mapTypeControl: false,
                streetViewControl: false,
                gestureHandling: "greedy"
            });

            const trafficLayer = new google.maps.TrafficLayer();
            trafficLayer.setMap(map);
        } catch (e) {
            console.error("Error en la inicialización de Maps:", e);
        }
    }

    function toggleDashboard() {
        const container = document.getElementById('app-container');
        isDashboardOpen = !isDashboardOpen;

        if (isDashboardOpen) {
            container.classList.add('split-view');
            fetchNews();
        } else {
            container.classList.remove('split-view');
        }

        setTimeout(() => {
            if (map && typeof google !== 'undefined') {
                google.maps.event.trigger(map, 'resize');
                map.setCenter(gdlCenter);
            }
        }, 500);
    }

    async function fetchNews() {
        const contentDiv = document.getElementById('news-content');
        contentDiv.innerHTML = '<p>Buscando disrupciones viales...</p>';

        // Búsqueda simplificada para evitar Error 500
        const query = encodeURIComponent("bloqueos carreteras Mexico OR inundaciones OR huelga transporte");
        const rssUrl = `https://news.google.com/rss/search?q=${query}&hl=es-419&gl=MX&ceid=MX:es-419`;
        const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;

        try {
            const res = await fetch(apiUrl);
            const data = await res.json();

            if (data.status === "ok") {
                // Ordenar por fecha: Más reciente primero
                const sortedItems = data.items.sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));
                
                contentDiv.innerHTML = sortedItems.slice(0, 15).map(item => {
                    const dateStr = new Date(item.pubDate).toLocaleString('es-MX', {
                        day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit'
                    });
                    return `
                        <div class="news-card">
                            <div class="news-date">${dateStr}</div>
                            <h3>${item.title}</h3>
                            <a class="news-link" href="${item.link}" target="_blank">VER DETALLES ➜</a>
                        </div>
                    `;
                }).join('');
            } else {
                contentDiv.innerHTML = "<p>No se encontraron noticias recientes.</p>";
            }
        } catch (err) {
            console.error("Error Fetching News:", err);
            contentDiv.innerHTML = "<p>Error al obtener noticias. Intente más tarde.</p>";
        }
    }
</script>

</body>
</html>
