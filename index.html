<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Tower MX - Riesgos en Ruta</title>
    <!-- Cargamos la librería oficial de Google Charts -->
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #e74c3c;
            --bg-light: #f4f7f6;
        }

        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            overflow: hidden; background-color: #ffffff;
        }

        #app-container {
            display: flex; width: 100vw; height: 100vh;
        }

        #map-wrapper {
            flex: 1; height: 100%; position: relative;
            display: flex; align-items: center; justify-content: center;
            background-color: #e5f1f6; /* Color de agua suave */
            transition: all 0.4s ease-in-out;
        }

        #regions_div {
            width: 100%; height: 100%;
        }

        #news-panel {
            width: 0%; height: 100%; background: var(--bg-light);
            border-left: 1px solid #ddd;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto; box-sizing: border-box;
        }

        .split-view #news-panel { width: 40%; padding: 20px; }
        .split-view #map-wrapper { flex: 0 0 60%; }

        .news-card {
            background: white; border-radius: 8px; padding: 15px;
            margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border-left: 5px solid var(--accent);
        }

        .news-card h3 { margin: 0 0 8px 0; font-size: 14px; line-height: 1.4; color: #333; }
        .news-date { font-size: 11px; color: #7f8c8d; font-weight: bold; margin-bottom: 5px; }
        .news-link { color: var(--primary); font-size: 12px; text-decoration: none; font-weight: bold; }
        
        .tag {
            display: inline-block; padding: 2px 6px; background: #eee;
            border-radius: 4px; font-size: 10px; color: #555; margin-right: 5px;
        }
    </style>
</head>
<body>

<div id="app-container">
    <div id="map-wrapper">
        <div id="regions_div"></div>
    </div>
    
    <div id="news-panel">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px;">
            <h2 id="panel-title" style="margin:0; font-size: 1.4rem; color: var(--primary);">Disrupciones Viales</h2>
            <button onclick="cerrarPanel()" style="border:none; background:none; font-size:28px; cursor:pointer; color:#888;">&times;</button>
        </div>
        <div id="news-content"></div>
    </div>
</div>

<script>
    // Diccionario para traducir los códigos ISO de Google al nombre real para la búsqueda
    const stateNames = {
        'MX-AGU': 'Aguascalientes', 'MX-BCN': 'Baja California', 'MX-BCS': 'Baja California Sur',
        'MX-CAM': 'Campeche', 'MX-CHP': 'Chiapas', 'MX-CHH': 'Chihuahua', 'MX-CMX': 'Ciudad de México',
        'MX-COA': 'Coahuila', 'MX-COL': 'Colima', 'MX-DUR': 'Durango', 'MX-GRO': 'Guerrero',
        'MX-GUA': 'Guanajuato', 'MX-HID': 'Hidalgo', 'MX-JAL': 'Jalisco', 'MX-MEX': 'Estado de México',
        'MX-MIC': 'Michoacán', 'MX-MOR': 'Morelos', 'MX-NAY': 'Nayarit', 'MX-NLE': 'Nuevo León',
        'MX-OAX': 'Oaxaca', 'MX-PUE': 'Puebla', 'MX-QUE': 'Querétaro', 'MX-ROO': 'Quintana Roo',
        'MX-SLP': 'San Luis Potosí', 'MX-SIN': 'Sinaloa', 'MX-SON': 'Sonora', 'MX-TAB': 'Tabasco',
        'MX-TAM': 'Tamaulipas', 'MX-TLA': 'Tlaxcala', 'MX-VER': 'Veracruz', 'MX-YUC': 'Yucatán',
        'MX-ZAC': 'Zacatecas'
    };

    let chart, data, options;

    // 1. Inicializar Google GeoCharts
    google.charts.load('current', {
        'packages':['geochart'],
    });
    google.charts.setOnLoadCallback(drawRegionsMap);

    function drawRegionsMap() {
        data = google.visualization.arrayToDataTable([
            ['Estado', 'Monitoreo'],
            ['MX-AGU', 0], ['MX-BCN', 0], ['MX-BCS', 0], ['MX-CAM', 0], ['MX-CHP', 0],
            ['MX-CHH', 0], ['MX-CMX', 0], ['MX-COA', 0], ['MX-COL', 0], ['MX-DUR', 0],
            ['MX-GRO', 0], ['MX-GUA', 0], ['MX-HID', 0], ['MX-JAL', 0], ['MX-MEX', 0],
            ['MX-MIC', 0], ['MX-MOR', 0], ['MX-NAY', 0], ['MX-NLE', 0], ['MX-OAX', 0],
            ['MX-PUE', 0], ['MX-QUE', 0], ['MX-ROO', 0], ['MX-SLP', 0], ['MX-SIN', 0],
            ['MX-SON', 0], ['MX-TAB', 0], ['MX-TAM', 0], ['MX-TLA', 0], ['MX-VER', 0],
            ['MX-YUC', 0], ['MX-ZAC', 0]
        ]);

        options = {
            region: 'MX', // Enfocado solo en México
            resolution: 'provinces', // Nivel estatal
            colorAxis: {colors: ['#3498db']}, // Color de los estados
            backgroundColor: '#e5f1f6', // Fondo del mar
            datalessRegionColor: '#f4f4f4',
            defaultColor: '#3498db',
            tooltip: { trigger: 'focus' },
            keepAspectRatio: true
        };

        chart = new google.visualization.GeoChart(document.getElementById('regions_div'));

        // Evento de clic en un estado
        google.visualization.events.addListener(chart, 'select', () => {
            const selection = chart.getSelection();
            if (selection.length > 0) {
                // Obtener el código ISO del estado clickeado
                const stateIso = data.getValue(selection[0].row, 0);
                const estadoReal = stateNames[stateIso];
                abrirPanel(estadoReal);
            }
        });

        chart.draw(data, options);
    }

    // 2. Control de la Interfaz
    function abrirPanel(estadoNombre) {
        const container = document.getElementById('app-container');
        document.getElementById('panel-title').innerText = `Rutas en ${estadoNombre}`;
        container.classList.add('split-view');
        
        // Redibujar el mapa tras la animación (400ms) para que se ajuste a su nuevo tamaño
        setTimeout(() => chart.draw(data, options), 400);
        
        fetchNewsForState(estadoNombre);
    }

    function cerrarPanel() {
        const container = document.getElementById('app-container');
        container.classList.remove('split-view');
        setTimeout(() => chart.draw(data, options), 400);
    }

    // 3. Extracción de Datos Estrictamente Logísticos
    async function fetchNewsForState(estadoNombre) {
        const contentDiv = document.getElementById('news-content');
        contentDiv.innerHTML = `<p style="text-align:center; color:#666;">Analizando telemetría de noticias para ${estadoNombre}...</p>`;

        // FILTRO ESTRICTO: Estado + Infraestructura + Disrupción
        const searchTerms = `"${estadoNombre}" AND (carretera OR autopista OR caseta OR libramiento OR peaje) AND (bloqueo OR cierre OR accidente OR manifestacion OR obras OR trafico)`;
        
        const rssUrl = `https://news.google.com/rss/search?q=${encodeURIComponent(searchTerms)}&hl=es-419&gl=MX&ceid=MX:es-419`;
        const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;

        try {
            const res = await fetch(apiUrl);
            const dataResponse = await res.json();

            if (dataResponse.status === "ok" && dataResponse.items.length > 0) {
                // Orden cronológico (Más reciente primero)
                const sortedItems = dataResponse.items.sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));
                
                contentDiv.innerHTML = sortedItems.slice(0, 15).map(item => {
                    const dateStr = new Date(item.pubDate).toLocaleString('es-MX', {
                        day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit'
                    });
                    return `
                        <div class="news-card">
                            <div class="news-date">📌 ${dateStr}</div>
                            <h3>${item.title}</h3>
                            <div>
                                <span class="tag">Logística</span>
                                <span class="tag">Ruta</span>
                            </div>
                            <br>
                            <a class="news-link" href="${item.link}" target="_blank">VER REPORTE DE INCIDENTE ➜</a>
                        </div>
                    `;
                }).join('');
            } else {
                contentDiv.innerHTML = `
                    <div style="text-align:center; padding: 20px;">
                        <p style="font-size: 40px; margin: 0;">✅</p>
                        <p style="color:#7f8c8d;">No hay bloqueos ni disrupciones carreteras reportadas en las últimas horas en ${estadoNombre}.</p>
                    </div>`;
            }
        } catch (err) {
            console.error("Error al extraer alertas:", err);
            contentDiv.innerHTML = "<p>Error de conexión al procesar los incidentes.</p>";
        }
    }

    // Redibujar mapa si el usuario cambia el tamaño de la ventana de su navegador
    window.addEventListener('resize', () => {
        if(chart && data && options) chart.draw(data, options);
    });
</script>

</body>
</html>
