<script>
    let map;
    let isDashboardOpen = false;
    
    // Centramos el mapa en Guadalajara para monitorear el corredor Occidente/Bajío
    const occidenteCenter = { lat: 20.6596, lng: -103.3496 };

    function initMap() {
        map = new google.maps.Map(document.getElementById("map"), {
            zoom: 6,
            center: occidenteCenter,
            mapTypeControl: false,
            streetViewControl: false,
        });

        const trafficLayer = new google.maps.TrafficLayer();
        trafficLayer.setMap(map);
    }

    function toggleDashboard() {
        const container = document.getElementById('app-container');
        const btn = document.getElementById('btn-text');
        isDashboardOpen = !isDashboardOpen;

        if (isDashboardOpen) {
            container.classList.add('split-view');
            btn.style.display = 'none'; 
            fetchNews();
        } else {
            container.classList.remove('split-view');
            btn.style.display = 'block'; 
        }

        setTimeout(() => {
            if (map) {
                google.maps.event.trigger(map, 'resize');
                map.setCenter(occidenteCenter); 
            }
        }, 400); 
    }

    async function fetchNews() {
        const contentDiv = document.getElementById('news-content');
        contentDiv.innerHTML = '<p style="text-align: center;">Procesando eventos recientes...</p>';

        // BÚSQUEDA AMPLIADA CON TUS NUEVAS PALABRAS CLAVE
        const queryTerm = "bloqueos OR manifestaciones OR trafico OR lluvias OR inundaciones OR huelgas OR cadena de suministro";
        const query = encodeURIComponent(`${queryTerm} mexico`);
        const rssUrl = `https://news.google.com/rss/search?q=${query}&hl=es-419&gl=MX&ceid=MX:es-419`;
        const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;

        try {
            const response = await fetch(apiUrl);
            const data = await response.json();

            if (data.status === "ok" && data.items.length > 0) {
                
                const noticiasOrdenadas = data.items.sort((a, b) => {
                    return new Date(b.pubDate) - new Date(a.pubDate);
                });

                const newsHtml = noticiasOrdenadas.slice(0, 15).map(item => {
                    const date = new Date(item.pubDate).toLocaleDateString('es-MX', { 
                        weekday: 'short', year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute:'2-digit' 
                    });
                    
                    return `
                        <div class="news-card">
                            <h3>${item.title}</h3>
                            <a href="${item.link}" target="_blank">Leer reporte completo ➜</a>
                            <span class="news-date">${date} - ${item.source || 'Google News'}</span>
                        </div>
                    `;
                }).join('');
                
                contentDiv.innerHTML = newsHtml;
            } else {
                contentDiv.innerHTML = '<p>No se encontraron disrupciones viales recientes.</p>';
            }
        } catch (error) {
            console.error("Error al cargar datos:", error);
            contentDiv.innerHTML = `
                <div style="color: #e74c3c; padding: 10px; border: 1px solid #e74c3c; border-radius: 5px;">
                    Error de conexión al cargar las noticias. Revisa la consola o intenta más tarde.
                </div>`;
        }
    }
</script>
